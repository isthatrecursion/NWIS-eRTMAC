services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: nwis
      POSTGRES_USER: nwis
      POSTGRES_PASSWORD: nwis
    ports:
      - "5432:5432"
    volumes:
      - nwis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nwis -d nwis"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NWIS_ENVIRONMENT: development
      NWIS_DATABASE_URL: postgresql+psycopg://nwis:nwis@db:5432/nwis
      NWIS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - nwis_documents:/app/storage
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      start_period: 120s
      retries: 24
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_DATA_PROVIDER: api
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 24
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nwis_pgdata:
  nwis_documents:
